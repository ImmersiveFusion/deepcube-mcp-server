name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            suffix: linux-amd64
          - rid: linux-arm64
            suffix: linux-arm64
          - rid: win-x64
            suffix: windows-amd64
          - rid: osx-arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/IF.APM.App.MCP.Server/IF.APM.App.MCP.Server.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output ./publish

      - name: Package
        run: cd publish && zip -r ../if-apm-mcp-server-${{ matrix.suffix }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: if-apm-mcp-server-${{ matrix.suffix }}
          path: if-apm-mcp-server-${{ matrix.suffix }}.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src/IF.APM.App.MCP.slnx --configuration Release --verbosity normal

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
